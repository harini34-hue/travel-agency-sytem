<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - TravelGo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f9fc;
            color: #333;
        }

        /* NAVBAR */
        .navbar {
            height: 70px;
            background-color: #0099cc;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 50px;
        }

        .logo {
            color: white;
            font-size: 28px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }

        /* LOGIN CARD */
        .login-container {
            width: 450px;
            margin: 70px auto;
            padding: 40px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.15);
        }

        .login-container h1 {
            text-align: center;
            color: #0077b6;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .login-container p {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        /* FORM */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #0099cc;
        }

        /* LOGIN BUTTON */
        .login-btn {
            width: 100%;
            padding: 14px;
            background-color: #0099cc;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background-color: #0077b6;
        }

        /* REGISTER LINK */
        .register-link {
            text-align: center;
            margin-top: 20px;
        }

        .register-link a {
            color: #0099cc;
            text-decoration: none;
            font-weight: bold;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        /* MOBILE */
        @media (max-width: 600px) {

            .navbar {
                padding: 0 20px;
            }

            .nav-links {
                gap: 10px;
            }

            .login-container {
                width: 90%;
                margin: 40px auto;
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">

        <div class="logo">
            ✈ TravelGo
        </div>

        <div class="nav-links">
            <a href="/">Home</a>
            <a href="#">Destinations</a>
            <a href="#">Packages</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>

    </nav>


    <!-- LOGIN FORM -->
    <div class="login-container">

        <h1>Welcome Back!</h1>

        <p>Login to continue your journey</p>

        <form method="POST">

            <!-- EMAIL -->
            <div class="form-group">
                <label>Email</label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required>
            </div>


            <!-- PASSWORD -->
            <div class="form-group">
                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required>
            </div>


            <!-- LOGIN BUTTON -->
            <button type="submit" class="login-btn">
                Login
            </button>

        </form>


        <!-- REGISTER LINK -->
        <div class="register-link">
            Don't have an account?
            <a href="/register">Register</a>
        </div>

    </div>

</body>

</html>
