<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - TravelGo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f9fc;
            color: #333;
        }

        /* NAVBAR */

        .navbar {
            height: 70px;
            background-color: #0099cc;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 50px;
        }

        .logo {
            color: white;
            font-size: 28px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }

        /* REGISTER CARD */

        .register-container {
            width: 500px;
            margin: 60px auto;
            padding: 40px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.15);
        }

        .register-container h1 {
            text-align: center;
            color: #0077b6;
            margin-bottom: 30px;
            font-size: 32px;
        }

        /* FORM */

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #0099cc;
        }

        /* BUTTON */

        .register-btn {
            width: 100%;
            padding: 14px;
            background-color: #0099cc;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .register-btn:hover {
            background-color: #0077b6;
        }

        /* MOBILE */

        @media (max-width: 600px) {
            .navbar {
                padding: 0 20px;
            }

            .nav-links {
                gap: 10px;
            }

            .register-container {
                width: 90%;
                margin: 30px auto;
                padding: 25px;
            }
        }
    </style>

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            ✈ TravelGo
        </div>

        <div class="nav-links">
            <a href="/">Home</a>
            <a href="#">Destinations</a>
            <a href="#">Packages</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>

    </nav>


    <!-- REGISTER FORM -->

    <div class="register-container">

        <h1>Create Account</h1>

        <form method="POST">

            <div class="form-group">
                <label>Name</label>
                <input type="text" name="name" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" required>
            </div>

            <div class="form-group">
                <label>Phone</label>
                <input type="text" name="phone">
            </div>

            <button type="submit" class="register-btn">
                Register
            </button>

        </form>

    </div>

</body>

</html>
