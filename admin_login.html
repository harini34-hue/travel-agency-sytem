<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - TravelGo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f9fc;
            min-height: 100vh;
        }

        .navbar {
            height: 70px;
            background: #0099cc;
            display: flex;
            align-items: center;
            padding: 0 50px;
        }

        .logo {
            color: white;
            font-size: 28px;
            font-weight: bold;
        }

        .container {
            width: 420px;
            margin: 70px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            color: #0077b6;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #0099cc;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0077b6;
        }
    </style>

</head>

<body>

    <nav class="navbar">
        <div class="logo">✈ TravelGo</div>
    </nav>

    <div class="container">

        <h1>Admin Login</h1>

        <p class="subtitle">
            Login to the TravelGo Admin Panel
        </p>

        <form method="POST">

            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="Enter admin email"
                required
            >

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter admin password"
                required
            >

            <button type="submit">
                Admin Login
            </button>

        </form>

    </div>

</body>

</html>
